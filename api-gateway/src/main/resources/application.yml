server:
  port: 8080 # Port för Gateway

# Eureka uppkoppling
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/ #Adress till service reg

spring:
  cloud:
    gateway:
      default-filters:
        - TokenRelay #Fångar inkommande JWT och bifogar den i Authorization headern till separata tjänsten (booking-service)
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            # Sökvägarna korrigerade för att matcha kontrollernas faktiska endpoints
            - Path=/api/users/**, /user-service/v3/api-docs
          filters:
            - RewritePath=/user-service/v3/api-docs, /v3/api-docs

        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/**, /booking-service/v3/api-docs
          filters:
            - RewritePath=/booking-service/v3/api-docs, /v3/api-docs
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: secret-key-here

# Aggregerar Swagger UI
springdoc:
  swagger-ui:
    urls:
      - name: User Service
        url: /user/v3/api-docs
      - name: Booking Service
        url: /booking/v3/api-docs

# Loggar fel vid nöd
logging:
  level:
    org.springframework.cloud.config: DEBUG
    org.springframework.retry: DEBUG
    org.springframework.boot.context.config: DEBUG