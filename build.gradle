plugins {
    id 'org.springframework.boot' version '4.0.0' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'java-test-fixtures'

    plugins.withType(JavaPlugin) {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
                vendor = JvmVendorSpec.ADOPTIUM
            }
        }
    }

    group = 'org.ChasAPI'
    version = 'latest'

    repositories {
        mavenCentral()
    }

    ext {
        springCloudVersion = "2025.1.0"
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
            mavenBom "org.springframework.boot:spring-boot-dependencies:4.0.0"
        }
    }

    dependencies{
        implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    }

    plugins.withId('org.springframework.boot'){
        tasks.named('bootBuildImage'){
            imageName = "microservices/${project.name}:${project.version}"
        }

        tasks.named('build'){
            finalizedBy(tasks.named('bootBuildImage'))
        }
    }


    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 21
    }
}


tasks.register("buildAllImages")

subprojects {
    plugins.withId("org.springframework.boot") {
        rootProject.tasks.named("buildAllImages") {
            dependsOn(tasks.named("bootBuildImage"))
        }
    }
}