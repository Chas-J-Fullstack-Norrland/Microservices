spring:
  application:
    name: user-service

  datasource:
    url: jdbc:h2:mem:bookingdb
    driverClassName: org.h2.Driver
    username: sa
    password:
    jpa:
      hibernate:
        ddl-auto: update
    security:
      oauth2:
        resourceserver:
          jwt:
            secret-key: secret-key-here

# Eureka uppkoppling
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

# Swagger ui -_- booking-service
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha

server:
  port: 8081
