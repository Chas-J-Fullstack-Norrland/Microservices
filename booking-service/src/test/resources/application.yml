spring:
  application:
    name: user-service
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
      fail-fast: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  datasource:
    driver-class-name: org.postgresql.Driver

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false