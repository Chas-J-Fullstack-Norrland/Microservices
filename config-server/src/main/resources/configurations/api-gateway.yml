server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: booking-service
          uri: lb://booking
          predicates:
            - Path=/api/bookings/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**

        - id: service-registry
          uri: lb://eureka:password
          predicates:
            - Path=/api/booking
eureka:
  client:
    initial-instance-info-replication-interval-seconds: 5
    serviceUrl:
      defaultZone: http://eureka:password@localhost:8761/eureka/
app:
  eureka-server: localhost